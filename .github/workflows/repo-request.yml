name: Repository Request Handler

on:
  issues:
    types: [labeled]

# Prevent parallel runs on the same issue
concurrency:
  group: repo-request-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle:
    name: Process decision
    if: contains(github.event.issue.labels.*.name, 'repo-request') && (github.event.label.name == 'approved' || github.event.label.name == 'rejected')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      # ── 1. Verify the labeler is an org admin ────────────────────────────────
      - name: Verify org admin
        id: verify
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_ADMIN_TOKEN }}
          script: |
            const sender = context.payload.sender.login;
            const org    = context.repo.owner;

            try {
              const { data } = await github.rest.orgs.getMembershipForUser({ org, username: sender });
              if (data.role !== 'admin') throw new Error('not an org admin');
              core.setOutput('authorized', 'true');
              core.info(`✅ ${sender} is an org admin`);
            } catch {
              core.setOutput('authorized', 'false');
              core.warning(`⛔ ${sender} is not an org admin`);

              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                name: context.payload.label.name,
              }).catch(() => {});

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `⛔ @${sender} — only **org admins** can approve or reject requests.\nThe label has been removed.`,
              });
            }

      # ── 2. Parse the issue form body ─────────────────────────────────────────
      - name: Parse issue body
        id: parse
        if: steps.verify.outputs.authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body      = context.payload.issue.body ?? '';
            const requester = context.payload.issue.user.login;
            const action    = context.payload.label.name;

            function extract(label) {
              const esc     = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const pattern = new RegExp(`### ${esc}\\s*\\n+([\\s\\S]+?)(?=\\n### |\\s*$)`);
              const match   = body.match(pattern);
              if (!match) return '';
              const val = match[1].trim();
              return (val === '_No response_') ? '' : val;
            }

            const repoName   = extract('Repository Name').trim().replace(/\s+/g, '-');
            const visibility = (extract('Visibility') || 'Private').toLowerCase();
            const team       = extract('Team').toLowerCase().replace(/\s+/g, '-');
            const email      = extract('Your Email Address');
            const validName  = /^[a-zA-Z0-9][a-zA-Z0-9._-]{0,98}[a-zA-Z0-9]$|^[a-zA-Z0-9]$/.test(repoName);

            core.setOutput('repo_name',  repoName);
            core.setOutput('description', extract('Description'));
            core.setOutput('visibility', visibility);
            core.setOutput('team',       team);
            core.setOutput('email',      email);
            core.setOutput('requester',  requester);
            core.setOutput('action',     action);
            core.setOutput('valid_name', String(validName));

            core.info(`repo: ${repoName} | visibility: ${visibility} | valid: ${validName}`);

      # ── 3a. Block if repo name is invalid ────────────────────────────────────
      - name: Abort - invalid repo name
        if: steps.verify.outputs.authorized == 'true' && steps.parse.outputs.action == 'approved' && steps.parse.outputs.valid_name == 'false'
        uses: actions/github-script@v7
        env:
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '## ❌ Cannot create repository — invalid name',
                '',
                `\`${process.env.REPO_NAME}\` is not a valid GitHub repository name.`,
                '',
                '**Rules:** letters, numbers, hyphens `-`, underscores `_`, dots `.` only. Must start and end with a letter or number.',
                '',
                'Please close this issue and open a new request with a valid name.',
              ].join('\n'),
            });
            core.setFailed('Invalid repository name');

      # ── 3b. Create the GitHub repository ─────────────────────────────────────
      - name: Create repository
        id: create
        if: steps.verify.outputs.authorized == 'true' && steps.parse.outputs.action == 'approved' && steps.parse.outputs.valid_name == 'true'
        uses: actions/github-script@v7
        env:
          REPO_NAME:   ${{ steps.parse.outputs.repo_name }}
          DESCRIPTION: ${{ steps.parse.outputs.description }}
          VISIBILITY:  ${{ steps.parse.outputs.visibility }}
          TEAM:        ${{ steps.parse.outputs.team }}
          REQUESTER:   ${{ steps.parse.outputs.requester }}
        with:
          github-token: ${{ secrets.GH_ADMIN_TOKEN }}
          script: |
            const org        = context.repo.owner;
            const name       = process.env.REPO_NAME;
            const team       = process.env.TEAM;
            const requester  = process.env.REQUESTER;

            // Create repo
            let repo;
            try {
              const { data } = await github.rest.repos.createInOrg({
                org,
                name,
                description:   process.env.DESCRIPTION,
                visibility:    process.env.VISIBILITY,
                auto_init:     true,
                has_issues:    true,
                has_projects:  false,
                has_wiki:      false,
              });
              repo = data;
              core.info(`✅ Created: ${repo.html_url}`);
            } catch (err) {
              const msg = err.status === 422
                ? `Repository "${name}" already exists in the organization.`
                : `GitHub API error (${err.status}): ${err.message}`;
              core.setFailed(msg);
              return;
            }

            core.setOutput('repo_url', repo.html_url);

            // Assign team (non-fatal)
            if (team) {
              try {
                await github.rest.teams.addOrUpdateRepoPermissionsInOrg({
                  org, team_slug: team, owner: org, repo: name, permission: 'push',
                });
                core.info(`✅ Team "${team}" granted push access`);
              } catch (err) {
                core.warning(`Team assignment failed: ${err.message}`);
              }
            }

            // Add requester as collaborator (non-fatal)
            try {
              await github.rest.repos.addCollaborator({
                owner: org, repo: name, username: requester, permission: 'push',
              });
              core.info(`✅ @${requester} added as collaborator`);
            } catch (err) {
              core.warning(`Collaborator invite failed: ${err.message}`);
            }

      # ── 4a. Populate repo with default templates and LICENSE ─────────────────
      - name: Populate repository defaults
        if: steps.verify.outputs.authorized == 'true' && steps.parse.outputs.action == 'approved' && steps.create.outcome == 'success'
        uses: actions/github-script@v7
        env:
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
        with:
          github-token: ${{ secrets.GH_ADMIN_TOKEN }}
          script: |
            const org  = context.repo.owner;
            const repo = process.env.REPO_NAME;
            const year = new Date().getFullYear();
            const b64  = s => Buffer.from(s).toString('base64');
            const msg  = 'chore: add default templates and LICENSE';

            const license = [
              'MIT License',
              '',
              `Copyright (c) ${year} ${org}`,
              '',
              'Permission is hereby granted, free of charge, to any person obtaining a copy',
              'of this software and associated documentation files (the "Software"), to deal',
              'in the Software without restriction, including without limitation the rights',
              'to use, copy, modify, merge, publish, distribute, sublicense, and/or sell',
              'copies of the Software, and to permit persons to whom the Software is',
              'furnished to do so, subject to the following conditions:',
              '',
              'The above copyright notice and this permission notice shall be included in all',
              'copies or substantial portions of the Software.',
              '',
              'THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR',
              'IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,',
              'FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE',
              'AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER',
              'LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,',
              'OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE',
              'SOFTWARE.',
            ].join('\n');

            const bugReport = [
              'name: Bug Report',
              'description: Report a bug or unexpected behaviour',
              'title: "[Bug] "',
              'labels: ["bug"]',
              'body:',
              '  - type: markdown',
              '    attributes:',
              '      value: "Thanks for reporting a bug. Fill in as much detail as you can."',
              '',
              '  - type: textarea',
              '    id: description',
              '    attributes:',
              '      label: What happened?',
              '      description: A clear description of the bug.',
              '    validations:',
              '      required: true',
              '',
              '  - type: textarea',
              '    id: reproduction',
              '    attributes:',
              '      label: Steps to reproduce',
              '      placeholder: |',
              "        1. Go to '...'",
              "        2. Click on '...'",
              '        3. See error',
              '    validations:',
              '      required: true',
              '',
              '  - type: textarea',
              '    id: expected',
              '    attributes:',
              '      label: Expected behaviour',
              '    validations:',
              '      required: true',
              '',
              '  - type: textarea',
              '    id: environment',
              '    attributes:',
              '      label: Environment',
              '      placeholder: |',
              '        - OS: macOS 14',
              '        - Runtime: Node 20',
              '        - Version: 1.0.0',
            ].join('\n');

            const featureRequest = [
              'name: Feature Request',
              'description: Suggest a new feature or improvement',
              'title: "[Feature] "',
              'labels: ["enhancement"]',
              'body:',
              '  - type: markdown',
              '    attributes:',
              '      value: "Thanks for suggesting an improvement!"',
              '',
              '  - type: textarea',
              '    id: problem',
              '    attributes:',
              '      label: Problem statement',
              '      description: What problem does this solve? Who is affected?',
              '    validations:',
              '      required: true',
              '',
              '  - type: textarea',
              '    id: solution',
              '    attributes:',
              '      label: Proposed solution',
              '      description: Describe what you would like to happen.',
              '    validations:',
              '      required: true',
              '',
              '  - type: textarea',
              '    id: alternatives',
              '    attributes:',
              '      label: Alternatives considered',
              '',
              '  - type: dropdown',
              '    id: priority',
              '    attributes:',
              '      label: Priority',
              '      options:',
              '        - Low',
              '        - Medium',
              '        - High',
              '    validations:',
              '      required: true',
            ].join('\n');

            const prTemplate = [
              '## Summary',
              '',
              '<!-- What does this PR do and why? Link related issues with "Fixes #123". -->',
              '',
              '## Changes',
              '',
              '- ',
              '',
              '## Test plan',
              '',
              '- [ ] ',
              '',
              '## Checklist',
              '',
              '- [ ] Tests added or updated',
              '- [ ] Documentation updated (if applicable)',
              '- [ ] No breaking changes (or clearly documented below)',
              '',
              '## Breaking changes',
              '',
              'N/A',
            ].join('\n');

            const files = [
              { path: 'LICENSE',                                       content: license       },
              { path: '.github/ISSUE_TEMPLATE/bug-report.yml',         content: bugReport     },
              { path: '.github/ISSUE_TEMPLATE/feature-request.yml',    content: featureRequest },
              { path: '.github/PULL_REQUEST_TEMPLATE.md',              content: prTemplate    },
            ];

            for (const { path, content } of files) {
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner: org, repo, path, message: msg,
                  content: b64(content),
                });
                core.info(`✅ Created ${path}`);
              } catch (err) {
                core.warning(`Could not create ${path}: ${err.message}`);
              }
            }

      # ── 5a. Comment + close — approved ───────────────────────────────────────
      - name: Comment - approved
        if: steps.verify.outputs.authorized == 'true' && steps.parse.outputs.action == 'approved' && steps.create.outcome == 'success'
        uses: actions/github-script@v7
        env:
          REPO_NAME:  ${{ steps.parse.outputs.repo_name }}
          REPO_URL:   ${{ steps.create.outputs.repo_url }}
          VISIBILITY: ${{ steps.parse.outputs.visibility }}
          REQUESTER:  ${{ steps.parse.outputs.requester }}
          TEAM:       ${{ steps.parse.outputs.team }}
        with:
          script: |
            const rows = [
              `| **Repository** | [\`${process.env.REPO_NAME}\`](${process.env.REPO_URL}) |`,
              `| **Visibility** | ${process.env.VISIBILITY} |`,
              `| **Requester**  | @${process.env.REQUESTER} |`,
            ];
            if (process.env.TEAM) rows.push(`| **Team** | \`${process.env.TEAM}\` |`);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: ['## ✅ Repository Created', '', '| | |', '|---|---|', ...rows, '', '> 📧 Notification email sent to requester.'].join('\n'),
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['completed'],
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

      # ── 5b. Comment + close — rejected ───────────────────────────────────────
      - name: Comment - rejected
        if: steps.verify.outputs.authorized == 'true' && steps.parse.outputs.action == 'rejected'
        uses: actions/github-script@v7
        env:
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
          REQUESTER: ${{ steps.parse.outputs.requester }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '## ❌ Request Rejected',
                '',
                `Your request for \`${process.env.REPO_NAME}\` has been reviewed and **rejected**.`,
                '',
                'If you have additional context, please open a new request with more detail.',
                '',
                '> 📧 Notification email sent to requester.',
              ].join('\n'),
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['rejected'],
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              state_reason: 'not_planned',
            });

      # ── 5c. Comment if creation failed ───────────────────────────────────────
      - name: Comment - creation failed
        if: steps.verify.outputs.authorized == 'true' && steps.parse.outputs.action == 'approved' && steps.create.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '## ⚠️ Repository Creation Failed',
                '',
                'The request was approved but the repository could not be created automatically.',
                '',
                `See the [workflow run](${runUrl}) for error details.`,
              ].join('\n'),
            });

      # ── 6. Send approval email ────────────────────────────────────────────────
      - name: Send approval email
        if: steps.verify.outputs.authorized == 'true' && steps.parse.outputs.action == 'approved' && steps.create.outcome == 'success' && steps.parse.outputs.email != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          TO_EMAIL:       ${{ steps.parse.outputs.email }}
          REQUESTER:      ${{ steps.parse.outputs.requester }}
          REPO_NAME:      ${{ steps.parse.outputs.repo_name }}
          REPO_URL:       ${{ steps.create.outputs.repo_url }}
          VISIBILITY:     ${{ steps.parse.outputs.visibility }}
        run: |
          python3 << 'EOF'
          import json, os, sys, urllib.request

          name = os.environ["REPO_NAME"]
          url  = os.environ["REPO_URL"]
          who  = os.environ["REQUESTER"]
          vis  = os.environ["VISIBILITY"].capitalize()

          html = f"""<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><style>
          body{{font-family:-apple-system,sans-serif;background:#f4f4f5;margin:0;padding:0}}
          .w{{max-width:540px;margin:40px auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1)}}
          .h{{background:#18181b;padding:24px 32px}}.h h1{{color:#fff;margin:0;font-size:18px;font-weight:600}}
          .b{{padding:32px;color:#374151;line-height:1.65}}.b p{{margin:0 0 16px}}
          .card{{background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:16px;margin:20px 0}}
          .card table{{width:100%;border-collapse:collapse}}
          .card td{{padding:6px 0;font-size:14px}}.card td:first-child{{color:#6b7280;width:120px;font-weight:500}}
          .btn{{display:inline-block;padding:11px 24px;background:#16a34a;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;font-size:14px}}
          .f{{padding:16px 32px;border-top:1px solid #e5e7eb;font-size:12px;color:#9ca3af}}
          </style></head><body><div class="w">
          <div class="h"><h1>Repo Request System</h1></div>
          <div class="b">
            <p>Hi <strong>@{who}</strong>,</p>
            <p>Your repository request has been <strong>approved</strong> and is ready to use.</p>
            <div class="card"><table>
              <tr><td>Repository</td><td><strong>{name}</strong></td></tr>
              <tr><td>Visibility</td><td>{vis}</td></tr>
              <tr><td>URL</td><td><a href="{url}">{url}</a></td></tr>
            </table></div>
            <p><a href="{url}" class="btn">Open Repository →</a></p>
          </div>
          <div class="f">Automated notification · Do not reply.</div>
          </div></body></html>"""

          payload = {
            "from":    os.environ.get("EMAIL_FROM", "Repo Requests <onboarding@resend.dev>"),
            "to":      [os.environ["TO_EMAIL"]],
            "subject": f"✅ Repo approved — {name}",
            "html":    html,
          }
          req = urllib.request.Request(
            "https://api.resend.com/emails",
            data=json.dumps(payload).encode(),
            headers={"Authorization": f"Bearer {os.environ['RESEND_API_KEY']}", "Content-Type": "application/json"},
            method="POST",
          )
          try:
            with urllib.request.urlopen(req, timeout=10) as r:
              print(f"Email sent — HTTP {r.status}")
          except Exception as e:
            print(f"Warning: email failed (non-fatal): {e}", file=sys.stderr)
          EOF

      # ── 7. Send rejection email ───────────────────────────────────────────────
      - name: Send rejection email
        if: steps.verify.outputs.authorized == 'true' && steps.parse.outputs.action == 'rejected' && steps.parse.outputs.email != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          TO_EMAIL:       ${{ steps.parse.outputs.email }}
          REQUESTER:      ${{ steps.parse.outputs.requester }}
          REPO_NAME:      ${{ steps.parse.outputs.repo_name }}
        run: |
          python3 << 'EOF'
          import json, os, sys, urllib.request

          name = os.environ["REPO_NAME"]
          who  = os.environ["REQUESTER"]

          html = f"""<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><style>
          body{{font-family:-apple-system,sans-serif;background:#f4f4f5;margin:0;padding:0}}
          .w{{max-width:540px;margin:40px auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1)}}
          .h{{background:#18181b;padding:24px 32px}}.h h1{{color:#fff;margin:0;font-size:18px;font-weight:600}}
          .b{{padding:32px;color:#374151;line-height:1.65}}.b p{{margin:0 0 16px}}
          .card{{background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:16px;margin:20px 0}}
          .card table{{width:100%;border-collapse:collapse}}
          .card td{{padding:6px 0;font-size:14px}}.card td:first-child{{color:#6b7280;width:120px;font-weight:500}}
          .f{{padding:16px 32px;border-top:1px solid #e5e7eb;font-size:12px;color:#9ca3af}}
          </style></head><body><div class="w">
          <div class="h"><h1>Repo Request System</h1></div>
          <div class="b">
            <p>Hi <strong>@{who}</strong>,</p>
            <p>Your request for <strong>{name}</strong> has been <strong>rejected</strong> after review.</p>
            <div class="card"><table>
              <tr><td>Repository</td><td>{name}</td></tr>
              <tr><td>Status</td><td>Rejected</td></tr>
            </table></div>
            <p>If you have additional context, please open a new request with more detail.</p>
          </div>
          <div class="f">Automated notification · Do not reply.</div>
          </div></body></html>"""

          payload = {
            "from":    os.environ.get("EMAIL_FROM", "Repo Requests <onboarding@resend.dev>"),
            "to":      [os.environ["TO_EMAIL"]],
            "subject": f"❌ Repo request rejected — {name}",
            "html":    html,
          }
          req = urllib.request.Request(
            "https://api.resend.com/emails",
            data=json.dumps(payload).encode(),
            headers={"Authorization": f"Bearer {os.environ['RESEND_API_KEY']}", "Content-Type": "application/json"},
            method="POST",
          )
          try:
            with urllib.request.urlopen(req, timeout=10) as r:
              print(f"Email sent — HTTP {r.status}")
          except Exception as e:
            print(f"Warning: email failed (non-fatal): {e}", file=sys.stderr)
          EOF
