name: Repository Request Handler

on:
  issues:
    types: [labeled]

# Prevent parallel runs on the same issue
concurrency:
  group: repo-request-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle:
    name: Process decision
    # Only run when a decision label is applied to a repo-request issue
    if: |
      contains(github.event.issue.labels.*.name, 'repo-request') &&
      (github.event.label.name == 'approved' || github.event.label.name == 'rejected')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      # ── 1. Verify the person who applied the label is an org admin ──────────
      - name: Verify org admin
        id: verify
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_ADMIN_TOKEN }}
          script: |
            const sender = context.payload.sender.login;
            const org    = context.repo.owner;

            try {
              const { data } = await github.rest.orgs.getMembershipForUser({ org, username: sender });

              if (data.role !== 'admin') throw new Error('not an org admin');

              core.setOutput('authorized', 'true');
              core.info(`✅ ${sender} is an org admin — proceeding`);

            } catch {
              core.setOutput('authorized', 'false');
              core.warning(`⛔ ${sender} is not an org admin — removing label`);

              // Remove the label so the issue stays open for a real admin
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.payload.issue.number,
                name: context.payload.label.name,
              }).catch(() => {});

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `⛔ @${sender} — only **org admins** can approve or reject requests.\nThe label has been removed. Please wait for an admin to review this request.`,
              });
            }

      # ── 2. Parse the structured issue form body ─────────────────────────────
      - name: Parse issue body
        id: parse
        if: steps.verify.outputs.authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body      = context.payload.issue.body ?? '';
            const requester = context.payload.issue.user.login;
            const action    = context.payload.label.name;

            function extract(label) {
              const esc     = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const pattern = new RegExp(`### ${esc}\\s*\\n+([\\s\\S]+?)(?=\\n### |\\s*$)`);
              const match   = body.match(pattern);
              if (!match) return '';
              const val = match[1].trim();
              return (val === '_No response_' || val === '') ? '' : val;
            }

            const repoName    = extract('Repository Name').trim().replace(/\s+/g, '-');
            const description = extract('Description');
            const visibility  = (extract('Visibility') || 'Private').toLowerCase();
            const team        = extract('Team').toLowerCase().replace(/\s+/g, '-');
            const email       = extract('Your Email Address');

            // Validate: GitHub allows letters, numbers, hyphens, underscores, dots
            const validName = /^[a-zA-Z0-9][a-zA-Z0-9._-]{0,98}[a-zA-Z0-9]$|^[a-zA-Z0-9]$/.test(repoName);

            core.setOutput('repo_name',    repoName);
            core.setOutput('description',  description);
            core.setOutput('visibility',   visibility);
            core.setOutput('team',         team);
            core.setOutput('email',        email);
            core.setOutput('requester',    requester);
            core.setOutput('action',       action);
            core.setOutput('valid_name',   validName.toString());

            core.info(`repo_name:   ${repoName}`);
            core.info(`visibility:  ${visibility}`);
            core.info(`email:       ${email}`);
            core.info(`valid_name:  ${validName}`);

      # ── 3a. Block approval if repo name is invalid ──────────────────────────
      - name: Abort — invalid repo name
        if: |
          steps.verify.outputs.authorized == 'true'  &&
          steps.parse.outputs.action      == 'approved' &&
          steps.parse.outputs.valid_name  == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '## ❌ Cannot create repository — invalid name',
                '',
                `\`${{ steps.parse.outputs.repo_name }}\` is not a valid GitHub repository name.`,
                '',
                '**Rules:** letters, numbers, hyphens \`-\`, underscores \`_\`, and dots \`.\` only.',
                'Must start and end with a letter or number. Max 100 characters.',
                '',
                'Please close this issue and open a new request with a corrected name.',
              ].join('\n'),
            });
            core.setFailed('Invalid repository name — aborting');

      # ── 3b. Create the GitHub repository ────────────────────────────────────
      - name: Create repository
        id: create
        if: |
          steps.verify.outputs.authorized == 'true'  &&
          steps.parse.outputs.action      == 'approved' &&
          steps.parse.outputs.valid_name  == 'true'
        uses: actions/github-script@v7
        env:
          REPO_NAME:   ${{ steps.parse.outputs.repo_name }}
          DESCRIPTION: ${{ steps.parse.outputs.description }}
          VISIBILITY:  ${{ steps.parse.outputs.visibility }}
          TEAM:        ${{ steps.parse.outputs.team }}
          REQUESTER:   ${{ steps.parse.outputs.requester }}
        with:
          github-token: ${{ secrets.GH_ADMIN_TOKEN }}
          script: |
            const org         = context.repo.owner;
            const name        = process.env.REPO_NAME;
            const description = process.env.DESCRIPTION;
            const visibility  = process.env.VISIBILITY;
            const team        = process.env.TEAM;
            const requester   = process.env.REQUESTER;

            // ── Create repo ────────────────────────────────────────────────
            let repo;
            try {
              const { data } = await github.rest.repos.createInOrg({
                org,
                name,
                description,
                visibility,
                auto_init:     true,
                has_issues:    true,
                has_projects:  false,
                has_wiki:      false,
                has_downloads: false,
              });
              repo = data;
              core.info(`✅ Repo created: ${repo.html_url}`);
            } catch (err) {
              const msg = err.status === 422
                ? `Repository "${name}" already exists in the organization.`
                : `GitHub API error (${err.status}): ${err.message}`;
              core.setFailed(msg);
              return;
            }

            core.setOutput('repo_url',       repo.html_url);
            core.setOutput('repo_full_name', repo.full_name);

            // ── Assign team (non-fatal) ────────────────────────────────────
            if (team) {
              try {
                await github.rest.teams.addOrUpdateRepoPermissionsInOrg({
                  org,
                  team_slug:  team,
                  owner:      org,
                  repo:       name,
                  permission: 'push',
                });
                core.info(`✅ Team "${team}" granted push access`);
              } catch (err) {
                core.warning(`Team assignment failed: ${err.message}`);
              }
            }

            // ── Add requester as collaborator (non-fatal) ──────────────────
            try {
              await github.rest.repos.addCollaborator({
                owner:      org,
                repo:       name,
                username:   requester,
                permission: 'push',
              });
              core.info(`✅ @${requester} added as collaborator`);
            } catch (err) {
              core.warning(`Could not add requester as collaborator: ${err.message}`);
            }

      # ── 4a. Comment + close issue — approved & created ──────────────────────
      - name: Comment — approved
        if: |
          steps.verify.outputs.authorized == 'true'  &&
          steps.parse.outputs.action      == 'approved' &&
          steps.create.outcome            == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const repoUrl  = '${{ steps.create.outputs.repo_url }}';
            const repoName = '${{ steps.parse.outputs.repo_name }}';

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '## ✅ Repository Created',
                '',
                '| | |',
                '|---|---|',
                `| **Repository** | [\`${repoName}\`](${repoUrl}) |`,
                `| **Visibility** | ${{ steps.parse.outputs.visibility }} |`,
                `| **Requester**  | @${{ steps.parse.outputs.requester }} |`,
                ${{ steps.parse.outputs.team != '' && '"| **Team** | `' + steps.parse.outputs.team + '` |",' || '"",' }}
                '',
                '> 📧 An email notification has been sent to the requester.',
              ].filter(Boolean).join('\n'),
            });

            await github.rest.issues.addLabels({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.payload.issue.number,
              labels:       ['completed'],
            });

            await github.rest.issues.update({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.payload.issue.number,
              state:        'closed',
              state_reason: 'completed',
            });

      # ── 4b. Comment + close issue — rejected ────────────────────────────────
      - name: Comment — rejected
        if: |
          steps.verify.outputs.authorized == 'true' &&
          steps.parse.outputs.action      == 'rejected'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '## ❌ Request Rejected',
                '',
                `Your request for \`${{ steps.parse.outputs.repo_name }}\` has been reviewed and **rejected**.`,
                '',
                'If you have additional context or believe this decision is incorrect, please open a new request with more detail.',
                '',
                '> 📧 An email notification has been sent to the requester.',
              ].join('\n'),
            });

            await github.rest.issues.addLabels({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.payload.issue.number,
              labels:       ['rejected'],
            });

            await github.rest.issues.update({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.payload.issue.number,
              state:        'closed',
              state_reason: 'not_planned',
            });

      # ── 4c. Comment if creation failed ──────────────────────────────────────
      - name: Comment — creation failed
        if: |
          steps.verify.outputs.authorized == 'true'  &&
          steps.parse.outputs.action      == 'approved' &&
          steps.create.outcome            == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '## ⚠️ Repository Creation Failed',
                '',
                'The request was approved but the repository could not be created automatically.',
                '',
                `Please check the [workflow run](${runUrl}) for the error details and create the repository manually.`,
              ].join('\n'),
            });

      # ── 5. Send approval email ───────────────────────────────────────────────
      - name: Send approval email
        if: |
          steps.verify.outputs.authorized == 'true'  &&
          steps.parse.outputs.action      == 'approved' &&
          steps.create.outcome            == 'success'  &&
          steps.parse.outputs.email       != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          TO_EMAIL:       ${{ steps.parse.outputs.email }}
          REQUESTER:      ${{ steps.parse.outputs.requester }}
          REPO_NAME:      ${{ steps.parse.outputs.repo_name }}
          REPO_URL:       ${{ steps.create.outputs.repo_url }}
          VISIBILITY:     ${{ steps.parse.outputs.visibility }}
        run: |
          python3 << 'EOF'
          import json, os, sys, urllib.request

          repo_name  = os.environ["REPO_NAME"]
          repo_url   = os.environ["REPO_URL"]
          requester  = os.environ["REQUESTER"]
          visibility = os.environ["VISIBILITY"].capitalize()

          html = f"""<!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8"><style>
            body{{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f5;margin:0;padding:0}}
            .w{{max-width:540px;margin:40px auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12)}}
            .h{{background:#18181b;padding:24px 32px}}.h h1{{color:#fff;margin:0;font-size:18px;font-weight:600}}
            .b{{padding:32px;color:#374151;line-height:1.65;font-size:15px}}
            .b p{{margin:0 0 16px}}
            .card{{background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:16px;margin:20px 0}}
            .card table{{width:100%;border-collapse:collapse}}
            .card td{{padding:7px 0;font-size:14px;vertical-align:top}}
            .card td:first-child{{color:#6b7280;width:130px;font-weight:500}}
            .btn{{display:inline-block;padding:11px 24px;background:#16a34a;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;font-size:14px}}
            .f{{padding:16px 32px;border-top:1px solid #e5e7eb;font-size:12px;color:#9ca3af}}
          </style></head>
          <body><div class="w">
            <div class="h"><h1>Repo Request System</h1></div>
            <div class="b">
              <p>Hi <strong>@{requester}</strong>,</p>
              <p>Your repository request has been <strong>approved</strong> and the repository is ready to use.</p>
              <div class="card"><table>
                <tr><td>Repository</td><td><strong>{repo_name}</strong></td></tr>
                <tr><td>Visibility</td><td>{visibility}</td></tr>
                <tr><td>URL</td><td><a href="{repo_url}">{repo_url}</a></td></tr>
              </table></div>
              <p><a href="{repo_url}" class="btn">Open Repository →</a></p>
            </div>
            <div class="f">Automated notification · Do not reply to this email.</div>
          </div></body></html>"""

          payload = {
            "from":    os.environ.get("EMAIL_FROM", "Repo Requests <onboarding@resend.dev>"),
            "to":      [os.environ["TO_EMAIL"]],
            "subject": f"✅ Repo approved — {repo_name}",
            "html":    html,
          }
          req = urllib.request.Request(
            "https://api.resend.com/emails",
            data=json.dumps(payload).encode(),
            headers={"Authorization": f"Bearer {os.environ['RESEND_API_KEY']}", "Content-Type": "application/json"},
            method="POST",
          )
          try:
            with urllib.request.urlopen(req, timeout=10) as r:
              print(f"Email sent — status {r.status}")
          except Exception as e:
            print(f"Warning: email failed (non-fatal): {e}", file=sys.stderr)
          EOF

      # ── 6. Send rejection email ──────────────────────────────────────────────
      - name: Send rejection email
        if: |
          steps.verify.outputs.authorized == 'true' &&
          steps.parse.outputs.action      == 'rejected' &&
          steps.parse.outputs.email       != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          TO_EMAIL:       ${{ steps.parse.outputs.email }}
          REQUESTER:      ${{ steps.parse.outputs.requester }}
          REPO_NAME:      ${{ steps.parse.outputs.repo_name }}
        run: |
          python3 << 'EOF'
          import json, os, sys, urllib.request

          repo_name = os.environ["REPO_NAME"]
          requester = os.environ["REQUESTER"]

          html = f"""<!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8"><style>
            body{{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f5;margin:0;padding:0}}
            .w{{max-width:540px;margin:40px auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12)}}
            .h{{background:#18181b;padding:24px 32px}}.h h1{{color:#fff;margin:0;font-size:18px;font-weight:600}}
            .b{{padding:32px;color:#374151;line-height:1.65;font-size:15px}}
            .b p{{margin:0 0 16px}}
            .card{{background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:16px;margin:20px 0}}
            .card table{{width:100%;border-collapse:collapse}}
            .card td{{padding:7px 0;font-size:14px;vertical-align:top}}
            .card td:first-child{{color:#6b7280;width:130px;font-weight:500}}
            .f{{padding:16px 32px;border-top:1px solid #e5e7eb;font-size:12px;color:#9ca3af}}
          </style></head>
          <body><div class="w">
            <div class="h"><h1>Repo Request System</h1></div>
            <div class="b">
              <p>Hi <strong>@{requester}</strong>,</p>
              <p>Your request for repository <strong>{repo_name}</strong> has been <strong>rejected</strong> after review.</p>
              <div class="card"><table>
                <tr><td>Repository</td><td>{repo_name}</td></tr>
                <tr><td>Status</td><td>Rejected</td></tr>
              </table></div>
              <p>If you have additional context or believe this is a mistake, please open a new request with more detail.</p>
            </div>
            <div class="f">Automated notification · Do not reply to this email.</div>
          </div></body></html>"""

          payload = {
            "from":    os.environ.get("EMAIL_FROM", "Repo Requests <onboarding@resend.dev>"),
            "to":      [os.environ["TO_EMAIL"]],
            "subject": f"❌ Repo request rejected — {repo_name}",
            "html":    html,
          }
          req = urllib.request.Request(
            "https://api.resend.com/emails",
            data=json.dumps(payload).encode(),
            headers={"Authorization": f"Bearer {os.environ['RESEND_API_KEY']}", "Content-Type": "application/json"},
            method="POST",
          )
          try:
            with urllib.request.urlopen(req, timeout=10) as r:
              print(f"Email sent — status {r.status}")
          except Exception as e:
            print(f"Warning: email failed (non-fatal): {e}", file=sys.stderr)
          EOF
